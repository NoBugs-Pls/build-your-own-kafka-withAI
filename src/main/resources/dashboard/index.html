<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleKafka Control Room</title>
  <style>
    :root{--bg:#10131a;--panel:#171c26;--panel2:#202734;--line:#303949;--text:#eef2f7;--muted:#98a4b5;--cyan:#6ee7e1;--orange:#ffb86b;--red:#ff6f7d;--green:#86e89c;--blue:#8eb8ff;--radius:8px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#243346 0,#10131a 38%);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#252e3d;color:var(--text);padding:9px 13px;border-radius:6px}button:hover{border-color:var(--cyan);color:var(--cyan)}button.danger{border-color:#75404b;color:#ff9ba5}input,select{background:#111722;border:1px solid var(--line);color:var(--text);padding:9px;border-radius:6px;width:100%}.shell{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.eyebrow{color:var(--cyan);letter-spacing:.12em;text-transform:uppercase;font-size:11px}.title{font:700 clamp(28px,4vw,52px)/1.05 Georgia,serif;margin:7px 0}.subtitle{color:var(--muted);max-width:700px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.panel{background:linear-gradient(145deg,rgba(32,39,52,.96),rgba(20,25,35,.96));border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 15px 35px #080a0e55}.zoo{grid-column:span 7}.brokers{grid-column:span 5}.producer,.consumer{grid-column:span 6}.logs,.files{grid-column:span 6}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.panel h2{font-size:16px;margin:0}.badge{font-size:11px;padding:4px 7px;border-radius:4px;background:#273243;color:var(--muted)}.badge.ok{color:var(--green);background:#183323}.badge.warn{color:var(--orange);background:#3b2b18}.badge.down{color:var(--red);background:#3c1d25}.metrics{display:flex;gap:22px;margin:10px 0 16px}.metric strong{display:block;font:700 25px Georgia,serif}.metric span,.hint{color:var(--muted);font-size:12px}.rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:9px 0}.mono{font:12px ui-monospace,monospace;color:#cbd5e1}.table{max-height:220px;overflow:auto}.form{display:grid;grid-template-columns:1fr 100px;gap:9px;margin-bottom:10px}.form.wide{grid-template-columns:repeat(3,1fr)}.form button{width:100%}.logbox{height:270px;overflow:auto;background:#0b0e14;border:1px solid #252d38;border-radius:6px;padding:10px;font:12px/1.7 ui-monospace,monospace;color:#b8c4d3}.logline{border-bottom:1px solid #19202b;padding:2px 0}.logline b{color:var(--cyan)}.toast{position:fixed;right:22px;bottom:22px;background:#26364b;border:1px solid var(--cyan);padding:12px 15px;border-radius:6px;display:none}.empty{color:var(--muted);padding:20px 0}@media(max-width:900px){.shell{padding:16px}.zoo,.brokers,.producer,.consumer,.logs,.files{grid-column:span 12}.top{display:block}.top-actions{margin-top:16px}.form.wide{grid-template-columns:1fr}.metrics{gap:15px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div><div class="eyebrow">SimpleKafka / Control Room</div><h1 class="title">操控你的消息集群</h1><div class="subtitle">ZooKeeper 元数据、Broker 生命周期、生产者发送和消费者读取集中在一个可观察的工作台。</div></div><div class="top-actions"><button onclick="startCluster()">启动三节点集群</button><button class="danger" onclick="stopCluster()">停止全部</button><button onclick="refresh()">刷新状态</button></div></header>
  <section class="grid">
    <article class="panel zoo"><div class="panel-head"><h2>ZooKeeper / 元数据</h2><span id="zkBadge" class="badge">连接检查中</span></div><div class="metrics"><div class="metric"><strong id="controller">-</strong><span>Controller</span></div><div class="metric"><strong id="zkBrokerCount">0</strong><span>注册 Broker</span></div><div class="metric"><strong id="topicCount">0</strong><span>Topic</span></div></div><div id="zkTopics" class="rows"></div></article>
    <article class="panel brokers"><div class="panel-head"><h2>Broker / 生命周期</h2><span class="badge">可强杀</span></div><div id="brokerRows" class="rows"></div></article>
    <article class="panel producer"><div class="panel-head"><h2>Producer / 发送</h2><span class="badge">UTF-8</span></div><div class="form wide"><input id="pTopic" value="test-topic" placeholder="Topic"><input id="pPartition" type="number" value="0" min="0" placeholder="分区"><input id="pPort" type="number" value="9091" placeholder="Broker 端口"></div><div class="form"><input id="pMessage" value="hello simple kafka" placeholder="消息内容"><button onclick="produce()">发送</button></div><div class="form"><input id="newTopic" value="test-topic" placeholder="新 Topic"><button onclick="createTopic()">创建 Topic</button></div><div id="produceResult" class="hint">发送结果会显示在这里。</div></article>
    <article class="panel consumer"><div class="panel-head"><h2>Consumer / 消费</h2><span class="badge">手动拉取</span></div><div class="form wide"><input id="cTopic" value="test-topic" placeholder="Topic"><input id="cPartition" type="number" value="0" min="0"><input id="cPort" type="number" value="9091"></div><div class="form"><input id="cOffset" type="number" value="0" min="0" placeholder="起始 offset"><button onclick="fetchMessages()">拉取</button></div><div id="consumerResult" class="rows"><div class="empty">消息会显示在这里。</div></div></article>
    <article class="panel logs"><div class="panel-head"><h2>Cluster logs / 实时日志</h2><span class="badge">自动刷新</span></div><div id="logs" class="logbox"></div></article>
    <article class="panel files"><div class="panel-head"><h2>Data files / 持久化文件</h2><span class="badge">磁盘观察</span></div><div id="files" class="table rows"></div></article>
  </section>
</main><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);const api=async(path,body)=>{const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)}:undefined);const x=await r.json();if(!r.ok||x.ok===false)throw Error(x.error||'请求失败');return x};
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}
async function refresh(){try{const s=await (await fetch('/api/state')).json();renderState(s);const e=await (await fetch('/api/events')).json();$('logs').innerHTML=e.map(x=>`<div class="logline"><b>${x.time.slice(11,19)}</b> ${esc(x.message)}</div>`).join('');$('logs').scrollTop=$('logs').scrollHeight}catch(e){toast(e.message)}}
function renderState(s){const z=s.zookeeper;$('zkBadge').textContent=z.connected?'已连接':'不可用';$('zkBadge').className='badge '+(z.connected?'ok':'down');$('controller').textContent=z.controller||'-';$('zkBrokerCount').textContent=(z.brokers||[]).length;$('topicCount').textContent=(z.topics||[]).length;$('zkTopics').innerHTML=(z.topics||[]).map(t=>`<div class="row"><span>${esc(t.name)}</span><span class="mono">${t.partitions.map(p=>`P${p.id}: ${esc(p.assignment)}`).join(' · ')}</span></div>`).join('')||'<div class="empty">暂无元数据</div>';
const managedBrokers=(s.processes||[]).filter(p=>p.name.startsWith('broker'));
const zkBrokers=(z.brokers||[]);
const brokerMap=new Map();
for(const p of managedBrokers){brokerMap.set(p.name,{...p});}
for(const b of zkBrokers){const name=`broker-${b.id}`; if(!brokerMap.has(name)){brokerMap.set(name,{name,alive:true,pid:null,fromZk:true});}}
const brokerRows=[...brokerMap.values()].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
$('brokerRows').innerHTML=brokerRows.length?brokerRows.map(p=>`<div class="row"><span><span class="badge ${p.alive?'ok':'down'}">${p.alive?'UP':'DOWN'}</span> ${p.name} <span class="hint">PID ${p.pid||'-'}</span></span><span>${p.fromZk?'<button onclick="refresh()">刷新</button>':'<button onclick="proc(\'${p.name}\',\'restart\')">重启</button> <button class="danger" onclick="proc(\'${p.name}\',\'kill\')">强杀</button>'}</span></div>`).join(''):'<div class="empty">集群未启动</div>';$('files').innerHTML=(s.data||[]).map(f=>`<div class="row"><span class="mono">${esc(f.path)}</span><span>${f.bytes} B</span></div>`).join('')||'<div class="empty">暂无文件</div>'}
async function startCluster(){try{await api('/api/cluster/start',{count:3,basePort:9091,zkPort:2181});toast('集群启动命令已发送');setTimeout(refresh,1200)}catch(e){toast(e.message)}}async function stopCluster(){try{await api('/api/cluster/stop',{});toast('停止命令已发送');setTimeout(refresh,500)}catch(e){toast(e.message)}}async function proc(name,action){try{await api('/api/process',{name,action});toast(name+' '+action);setTimeout(refresh,500)}catch(e){toast(e.message)}}async function createTopic(){try{await api('/api/topic',{topic:$('newTopic').value,port:$('pPort').value,partitions:3,replicationFactor:3});toast('Topic 已创建');setTimeout(refresh,500)}catch(e){toast(e.message)}}async function produce(){try{const x=await api('/api/produce',{topic:$('pTopic').value,partition:$('pPartition').value,port:$('pPort').value,message:$('pMessage').value});$('produceResult').textContent='成功写入 offset = '+x.offset;toast('消息已写入')}catch(e){$('produceResult').textContent=e.message;toast(e.message)}}async function fetchMessages(){try{const x=await api('/api/fetch',{topic:$('cTopic').value,partition:$('cPartition').value,port:$('cPort').value,offset:$('cOffset').value});$('consumerResult').innerHTML=x.messages.map(m=>`<div class="row"><span class="badge ok">offset ${m.offset}</span><span>${esc(m.message)}</span></div>`).join('')||'<div class="empty">没有新消息</div>'}catch(e){$('consumerResult').innerHTML='<div class="empty">'+esc(e.message)+'</div>';toast(e.message)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}refresh();setInterval(refresh,2000);
</script></body></html>
